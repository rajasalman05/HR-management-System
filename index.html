<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HCM Lite - Login</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><div class="center">
<h1 style="text-align:center">🏢 HCM Lite</h1>
<div class="card" id="setupBox" hidden><h3>First-run setup</h3><p style="color:var(--muted);font-size:13px">Create your company and the Admin account.</p>
<form id="setupForm" novalidate>
<label>Company name</label><input name="company"><span class="err" data-err="company"></span>
<label>Admin name</label><input name="name"><span class="err" data-err="name"></span>
<label>Admin email</label><input name="email" type="email"><span class="err" data-err="email"></span>
<label>Password</label><input name="password" type="password"><span class="err" data-err="password"></span>
<button class="btn" style="width:100%">Create company</button></form></div>
<div class="card" id="loginBox" hidden><h3>Login</h3>
<form id="loginForm" novalidate>
<label>Email</label><input name="email" type="email"><span class="err" data-err="email"></span>
<label>Password</label><input name="password" type="password"><span class="err" data-err="password"></span>
<button class="btn" style="width:100%">Login</button></form></div>
</div>
<script src="js/storage.js"></script><script src="js/auth.js"></script></body></html>
