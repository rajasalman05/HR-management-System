<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><title>Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script></head>
<body><nav id="nav"></nav><main>
<h2>Admin Dashboard</h2><div class="grid" id="stats"></div>
<div class="two"><div class="card"><h3>Present by department (today)</h3><canvas id="c1"></canvas></div><div class="card"><h3>Last 7 days (check-ins)</h3><canvas id="c2"></canvas></div></div>
<div class="card"><h3>Attendance records</h3><div class="noprint"><input type="date" id="attDate" style="width:auto;display:inline-block"> <button class="btn sec" onclick="exportCSV()">Export all to CSV</button></div>
<table><thead><tr><th>Employee</th><th>Department</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th></tr></thead><tbody id="attBody"></tbody></table></div>
<div class="card"><h3>Monthly report</h3><div class="noprint"><input type="month" id="repMonth" style="width:auto;display:inline-block"> <button class="btn warn" onclick="window.print()">Print report</button></div>
<table><thead><tr><th>Employee</th><th>Present</th><th>Late</th><th>Half days</th><th>Absent</th><th>Leave days</th></tr></thead><tbody id="repBody"></tbody></table></div>
<div class="two"><div class="card"><h3>📢 Announcements</h3><form id="annForm" class="noprint"><textarea name="text" rows="2" placeholder="Write an announcement"></textarea><button class="btn">Post</button></form><div id="annList"></div></div>
<div class="card" id="helper"></div></div>
</main><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/helper.js"></script>
<script>
const me=guard(['admin']);
if(me){layout('admin');initHelper();
 const td=today();$('#attDate').value=td;$('#repMonth').value=td.slice(0,7);
 function stats(){
  const emps=employees(),A=allAttendance().filter(r=>r.date===td);
  const cards=[['Employees',emps.length,''],['Present today',A.length,''],['Late today',A.filter(r=>r.late).length,'warn'],['On leave',emps.filter(e=>onLeave(e.id,td)).length,'vio'],['Not checked in',emps.filter(e=>attStatus(e,td)==='not checked in').length,'bad'],['Pending leaves',allLeaves().filter(l=>l.status==='pending').length,'vio']];
  $('#stats').innerHTML=cards.map(c=>'<div class="stat '+c[2]+'"><b>'+c[1]+'</b><span>'+c[0]+'</span></div>').join('');
 }
 function charts(){
  if(typeof Chart==='undefined')return;
  const emps=employees(),A=allAttendance(),deps=[...new Set(emps.map(e=>e.department))];
  new Chart($('#c1'),{type:'bar',data:{labels:deps,datasets:[{label:'Present',data:deps.map(d=>emps.filter(e=>e.department===d&&A.some(r=>r.employeeId===e.id&&r.date===td)).length),backgroundColor:'#0f9d8a'}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(fmtDate(d))}
  new Chart($('#c2'),{type:'line',data:{labels:days.map(d=>d.slice(5)),datasets:[{label:'Check-ins',data:days.map(d=>A.filter(r=>r.date===d).length),borderColor:'#e8912d',tension:.3}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
 }
 function attTable(){
  const d=$('#attDate').value,A=allAttendance();
  $('#attBody').innerHTML=employees().map(e=>{const r=A.find(x=>x.employeeId===e.id&&x.date===d),s=attStatus(e,d);
   return'<tr><td>'+esc(e.name)+'</td><td>'+esc(e.department)+'</td><td>'+(r?r.in:'-')+'</td><td>'+(r&&r.out?r.out:'-')+'</td><td>'+(r&&r.out?hoursWorked(r).toFixed(1):'-')+'</td><td><span class="tag '+s.split(' ')[0]+'">'+s+'</span></td></tr>'}).join('')||'<tr><td colspan=6>No employees yet</td></tr>';
 }
 function report(){
  const m=$('#repMonth').value;if(!m)return;
  $('#repBody').innerHTML=employees().map(e=>{const s=summary(e.id,m);return'<tr><td>'+esc(e.name)+'</td><td>'+s.present+'</td><td>'+s.late+'</td><td>'+s.half+'</td><td>'+s.absent+'</td><td>'+s.leaveDays+'</td></tr>'}).join('')||'<tr><td colspan=6>No employees yet</td></tr>';
 }
 function exportCSV(){
  const us=users(),rows=[['Date','Employee','Check-in','Check-out','Status']];
  allAttendance().forEach(r=>rows.push([r.date,(us.find(u=>u.id===r.employeeId)||{name:'?'}).name,r.in,r.out||'',r.status]));
  downloadCSV('attendance.csv',rows);
 }
 function ann(){const a=DB.get('hcm_announcements',[]).reverse();$('#annList').innerHTML=a.map(x=>'<p><small>'+x.date+'</small><br>'+esc(x.text)+' <a href="#" class="noprint" onclick="delAnn('+x.id+');return false">✕</a></p>').join('')||'<p>No announcements</p>'}
 function delAnn(id){DB.set('hcm_announcements',DB.get('hcm_announcements',[]).filter(x=>x.id!==id));ann()}
 $('#annForm').addEventListener('submit',e=>{e.preventDefault();const t=e.target.text.value.trim();if(!t)return;const a=DB.get('hcm_announcements',[]);a.push({id:Date.now(),text:t,date:td});DB.set('hcm_announcements',a);e.target.reset();ann()});
 $('#attDate').onchange=attTable;$('#repMonth').onchange=report;
 stats();charts();attTable();report();ann();
}
</script></body></html>
