<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../css/style.css">
    <title>Employees - HCM Employee 360</title>
</head>
<body>
    <nav id="nav"></nav>
    <main>
        <div class="card">
            <h3 id="formTitle">Add New Employee</h3>
            <form id="empForm" novalidate>
                <div class="two">
                    <div>
                        <label>Full Name</label>
                        <input name="name" placeholder="e.g. Ali Khan" required>
                        <span class="err" data-err="name"></span>

                        <label>Father's Name</label>
                        <input name="fatherName" placeholder="e.g. Muhammad Khan" required>
                        <span class="err" data-err="fatherName"></span>

                        <label>Employee ID (Auto/Custom)</label>
                        <input name="empId" id="empIdInput" placeholder="e.g. EMP-1001" required>
                        <span class="err" data-err="empId"></span>
                        
                        <label>Phone Number</label>
                        <input name="phone" placeholder="e.g. +92 300 1234567" required>
                        <span class="err" data-err="phone"></span>
                    </div>
                    <div>
                        <label>Department</label>
                        <input name="department" list="depList" placeholder="e.g. Development" required>
                        <datalist id="depList"></datalist>
                        <span class="err" data-err="department"></span>

                        <label>Monthly Salary</label>
                        <input name="salary" type="number" min="0" step="any" placeholder="e.g. 50000" required>
                        <span class="err" data-err="salary"></span>

                        <label>Email (Login)</label>
                        <input name="email" type="email" placeholder="employee@company.com" required>
                        <span class="err" data-err="email"></span>

                        <label>Password</label>
                        <input name="password" type="password" placeholder="Min 4 characters" required>
                        <span class="err" data-err="password"></span>
                    </div>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button class="btn">Save Employee</button>
                    <button type="button" class="btn bad" id="cancelEdit" hidden onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>Employees Directory</h3>
            <div class="two" style="margin-bottom: 15px;">
                <input id="search" placeholder="Search by name, ID or email...">
                <select id="depFilter"></select>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Father's Name</th>
                            <th>Department</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Salary</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/employees.js"></script>
    <script>
        if (guard(['admin'])) {
            layout('employees');
            $('#empForm').addEventListener('submit', saveEmployee);
            $('#search').oninput = renderEmployees;
            $('#depFilter').onchange = renderEmployees;
            renderEmployees();
            
            // Auto generate Employee ID on load if adding new
            const empIdField = $('#empIdInput');
            if (empIdField && !empIdField.value) {
                empIdField.value = 'EMP-' + Math.floor(1000 + Math.random() * 9000);
            }
        }
    </script>
</body>
</html>
